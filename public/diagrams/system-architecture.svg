</defs><rect width="1800" height="1330" fill="#FFFFFF"/><g font-family="Arial, Helvetica, sans-serif" fill="#111820"><text x="60" y="67" font-size="43" fill="#111820" font-weight="700" text-anchor="start">together</text><text x="237" y="67" font-size="48" fill="#006AFF" font-weight="700" text-anchor="start">.</text><text x="320" y="65" font-size="38" fill="#111820" font-weight="500" text-anchor="start">System architecture</text><text x="60" y="111" font-size="22" fill="#46515F" font-weight="400" text-anchor="start">A shared relief workflow today. A local community network as the next physical prototype.</text><polyline points="64,146 115,146" fill="none" stroke="#006AFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="130" y="153" font-size="18" fill="#111820" font-weight="400" text-anchor="start">Implemented</text><polyline points="335,146 386,146" fill="none" stroke="#64758A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#grayarrow)"/><text x="401" y="153" font-size="18" fill="#111820" font-weight="400" text-anchor="start">Proposed physical deployment</text><rect x="805" y="129" width="435" height="32" rx="10" fill="#F3F7FC" stroke="#D5DEE8" stroke-width="2"/><text x="819" y="151" font-size="16" fill="#46515F" font-weight="600" text-anchor="start">3D GOVERNMENT BULLETIN = SIMULATED</text><rect x="55" y="180" width="1690" height="595" rx="27" fill="#FAFCFF" stroke="#B9CCE5" stroke-width="2"/><text x="80" y="216" font-size="19" fill="#006AFF" font-weight="600" text-anchor="start">WORKING MVP  /  THREE CHATGPT SITES + SHARED CLOUD BACKEND</text><text x="1240" y="216" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Demo Site: Three.js illustrations</text><rect x="80" y="245" width="350" height="275" rx="20" fill="white" stroke="#D5DEE8" stroke-width="2"/><rect x="100" y="265" width="54" height="54" rx="16" fill="#F3F7FC" stroke="#F3F7FC" stroke-width="2"/><use href="#phone" x="108" y="273" width="38" height="38" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="299" font-size="23" fill="#111820" font-weight="600" text-anchor="start">Resident mobile PWA</text><text x="104" y="343" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Help · safe check-in · messages</text><text x="104" y="370" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Hindi / English + language previews</text><rect x="103" y="390" width="304" height="101" rx="14" fill="#F3F7FC" stroke="#D5DEE8" stroke-width="2"/><text x="117" y="415" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Service worker + Cache Storage</text><text x="117" y="442" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">App, map and 6 saved guides</text><text x="117" y="469" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">localStorage: drafts + outbox</text><text x="103" y="511" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Prepared essentials work offline.</text><rect x="80" y="550" width="350" height="175" rx="20" fill="white" stroke="#D5DEE8" stroke-width="2"/><rect x="100" y="570" width="54" height="54" rx="16" fill="#F3F7FC" stroke="#F3F7FC" stroke-width="2"/><use href="#laptop" x="108" y="578" width="38" height="38" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="604" font-size="23" fill="#111820" font-weight="600" text-anchor="start">Laptop nodal console</text><text x="104" y="648" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Independent Site + fixed proxy</text><text x="104" y="675" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Server-only private service access</text><rect x="560" y="245" width="535" height="480" rx="20" fill="white" stroke="#D5DEE8" stroke-width="2"/><rect x="580" y="265" width="54" height="54" rx="16" fill="#F3F7FC" stroke="#F3F7FC" stroke-width="2"/><use href="#server" x="588" y="273" width="38" height="38" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="650" y="299" font-size="23" fill="#111820" font-weight="600" text-anchor="start">Cloudflare Workers API</text><text x="584" y="343" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Network routes + provider adapters</text><text x="584" y="370" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">UUID retry / forward-only status</text><text x="584" y="397" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Input bounds · origin / rate checks</text><rect x="585" y="468" width="485" height="77" rx="15" fill="#F3F7FC" stroke="#D5DEE8" stroke-width="2"/><text x="605" y="497" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Keys and provider calls stay server-side.</text><text x="605" y="524" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Cloud sync and new AI require internet.</text><rect x="585" y="566" width="485" height="127" rx="18" fill="white" stroke="#B9CCE5" stroke-width="2"/><use href="#database" x="605" y="590" width="54" height="54" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="678" y="603" font-size="24" fill="#111820" font-weight="600" text-anchor="start">Cloudflare D1</text><text x="678" y="636" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Requests · check-ins · messages</text><text x="678" y="663" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Received → ack → assigned → completed</text><polyline points="430,340 560,340" fill="none" stroke="#006AFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="457.0" y="300" width="76" height="28" rx="8" fill="white"/><text x="495" y="320" font-size="17" fill="#46515F" font-weight="400" text-anchor="middle">HTTPS</text><polyline points="430,633 505,633 505,423 560,423" fill="none" stroke="#006AFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="469.0" y="510" width="72" height="28" rx="8" fill="white"/><text x="505" y="530" font-size="17" fill="#46515F" font-weight="400" text-anchor="middle">HTTPS</text><rect x="1240" y="245" width="480" height="131" rx="20" fill="white" stroke="#D5DEE8" stroke-width="2"/><rect x="1260" y="265" width="54" height="54" rx="16" fill="#F3F7FC" stroke="#F3F7FC" stroke-width="2"/><use href="#cloud" x="1268" y="273" width="38" height="38" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="1330" y="299" font-size="23" fill="#111820" font-weight="600" text-anchor="start">OpenAI</text><text x="1264" y="343" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Responses: short assistance</text><text x="1264" y="370" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Decisions: routing suggestion</text><rect x="1240" y="395" width="480" height="131" rx="20" fill="white" stroke="#D5DEE8" stroke-width="2"/><rect x="1260" y="415" width="54" height="54" rx="16" fill="#F3F7FC" stroke="#F3F7FC" stroke-width="2"/><use href="#cloud" x="1268" y="423" width="38" height="38" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="1330" y="449" font-size="23" fill="#111820" font-weight="600" text-anchor="start">Cerebras</text><text x="1264" y="493" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">OpenAI gpt-oss-120b inference</text><text x="1264" y="520" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Bounded, concise cloud answers</text><rect x="1240" y="545" width="480" height="180" rx="20" fill="white" stroke="#D5DEE8" stroke-width="2"/><rect x="1260" y="565" width="54" height="54" rx="16" fill="#F3F7FC" stroke="#F3F7FC" stroke-width="2"/><use href="#cloud" x="1268" y="573" width="38" height="38" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="1330" y="599" font-size="23" fill="#111820" font-weight="600" text-anchor="start">Exa Agent</text><text x="1264" y="643" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Asynchronous district research</text><text x="1264" y="670" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Source links + dates → human review</text><text x="1264" y="697" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">1-hour isolate cache; not durable storage</text><polyline points="1095,350 1165,350 1165,309 1240,309" fill="none" stroke="#006AFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1165,350 1165,460 1240,460" fill="none" stroke="#006AFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="1165,460 1165,616 1240,616" fill="none" stroke="#006AFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1240" y="752" font-size="16" fill="#46515F" font-weight="400" text-anchor="start">Separate research; no automatic chat grounding</text><text x="80" y="750" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">ChatGPT Sites hosts the experiences  ·  Codex supports implementation, debugging and validation</text><use href="#wifi" x="75" y="800" width="36" height="36" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="125" y="823" font-size="21" fill="#111820" font-weight="500" text-anchor="start">Ordinary phones use Wi-Fi or internet. A dedicated bridge is required to reach a LoRa radio.</text><rect x="55" y="855" width="1690" height="380" rx="27" fill="#FAFBFD" stroke="#8799AF" stroke-width="2" stroke-dasharray="10 8"/><text x="80" y="894" font-size="19" fill="#46515F" font-weight="600" text-anchor="start">PROPOSED FIELD DEPLOYMENT  /  ILLUSTRATED IN THE 3D DEMO; NO PHYSICAL RADIO IS CONNECTED</text><polyline points="1620,1010 1620,945 540,945 540,1010" fill="none" stroke="#64758A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#grayarrow)"/><rect x="857.5" y="923" width="405" height="28" rx="8" fill="white"/><text x="1060" y="943" font-size="17" fill="#46515F" font-weight="400" text-anchor="middle">Available backhaul · reviewed bulletin</text><rect x="80" y="1010" width="230" height="180" rx="20" fill="white" stroke="#D5DEE8" stroke-width="2" stroke-dasharray="10 8"/><rect x="100" y="1030" width="54" height="54" rx="16" fill="#F3F7FC" stroke="#F3F7FC" stroke-width="2"/><use href="#wifi" x="108" y="1038" width="38" height="38" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="170" y="1064" font-size="23" fill="#111820" font-weight="600" text-anchor="start">Phones + AP</text><text x="104" y="1108" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Join local Wi-Fi</text><text x="104" y="1135" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Rich local content</text><rect x="365" y="1010" width="350" height="180" rx="20" fill="white" stroke="#D5DEE8" stroke-width="2" stroke-dasharray="10 8"/><rect x="385" y="1030" width="54" height="54" rx="16" fill="#F3F7FC" stroke="#F3F7FC" stroke-width="2"/><use href="#pi" x="393" y="1038" width="38" height="38" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="455" y="1064" font-size="23" fill="#111820" font-weight="600" text-anchor="start">Raspberry Pi hub</text><text x="389" y="1108" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Local service + queue + cache</text><text x="389" y="1135" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Approved guides / bulletin store</text><text x="389" y="1162" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Kiwix library: future option</text><rect x="785" y="1010" width="350" height="180" rx="20" fill="white" stroke="#D5DEE8" stroke-width="2" stroke-dasharray="10 8"/><rect x="805" y="1030" width="54" height="54" rx="16" fill="#F3F7FC" stroke="#F3F7FC" stroke-width="2"/><use href="#radio" x="813" y="1038" width="38" height="38" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="875" y="1064" font-size="23" fill="#111820" font-weight="600" text-anchor="start">Radio bridge</text><text x="809" y="1108" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">USB serial → ESP32</text><text x="809" y="1135" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">SX127x LoRa + antenna</text><text x="809" y="1162" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Firmware / transport to build</text><rect x="1205" y="1010" width="260" height="180" rx="20" fill="white" stroke="#D5DEE8" stroke-width="2" stroke-dasharray="10 8"/><rect x="1225" y="1030" width="54" height="54" rx="16" fill="#F3F7FC" stroke="#F3F7FC" stroke-width="2"/><use href="#radio" x="1233" y="1038" width="38" height="38" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="1295" y="1064" font-size="23" fill="#111820" font-weight="600" text-anchor="start">Other hubs</text><text x="1229" y="1108" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Compact text / status</text><text x="1229" y="1135" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Relay design to validate</text><rect x="1515" y="1010" width="205" height="180" rx="20" fill="white" stroke="#D5DEE8" stroke-width="2" stroke-dasharray="10 8"/><use href="#server" x="1533" y="1030" width="44" height="44" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="1534" y="1100" font-size="22" fill="#111820" font-weight="600" text-anchor="start">Government</text><text x="1534" y="1128" font-size="22" fill="#111820" font-weight="600" text-anchor="start">head server</text><text x="1534" y="1170" font-size="17" fill="#46515F" font-weight="400" text-anchor="start">Publishing concept</text><polyline points="310,1100 365,1100" fill="none" stroke="#64758A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#grayarrow)" marker-start="url(#grayarrow)"/><rect x="304.5" y="981" width="65" height="28" rx="8" fill="white"/><text x="337" y="1001" font-size="17" fill="#46515F" font-weight="400" text-anchor="middle">Wi-Fi</text><polyline points="715,1100 785,1100" fill="none" stroke="#64758A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#grayarrow)" marker-start="url(#grayarrow)"/><rect x="722.0" y="981" width="56" height="28" rx="8" fill="white"/><text x="750" y="1001" font-size="17" fill="#46515F" font-weight="400" text-anchor="middle">USB</text><polyline points="1135,1100 1205,1100" fill="none" stroke="#64758A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#grayarrow)" marker-start="url(#grayarrow)"/><rect x="1138.5" y="981" width="63" height="28" rx="8" fill="white"/><text x="1170" y="1001" font-size="17" fill="#46515F" font-weight="400" text-anchor="middle">LoRa</text><text x="80" y="1219" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Future local storage, radio security / retries, power endurance and native-language review require field validation.</text><text x="60" y="1274" font-size="20" fill="#111820" font-weight="500" text-anchor="start">Physical links and official bulletin ingestion are not implemented. No local LLM is running in this MVP.</text><text x="60" y="1304" font-size="16" fill="#46515F" font-weight="400" text-anchor="start">Basis: Together source + validation record · LoRa physical layer: semtech.com/lora/what-is-lora · Topology: lora-alliance.org/about-lorawan</text></g></svg>