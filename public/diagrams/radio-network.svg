"#46515F" font-weight="400" text-anchor="middle">LoRa mesh hop</text><polyline points="865,350 1000,510" fill="none" stroke="#006AFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="855.0" y="408" width="170" height="28" rx="8" fill="white"/><text x="940" y="428" font-size="17" fill="#46515F" font-weight="400" text-anchor="middle">LoRa mesh hop</text><polyline points="390,475 530,655" fill="none" stroke="#006AFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrow)" marker-start="url(#arrow)"/><polyline points="730,678 1010,610" fill="none" stroke="#006AFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrow)" marker-start="url(#arrow)"/><rect x="130" y="380" width="280" height="107" rx="18" fill="white" stroke="#A7BFDF" stroke-width="2"/><use href="#radio" x="146" y="400" width="47" height="47" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="208" y="421" font-size="23" fill="#111820" font-weight="600" text-anchor="start">School hub</text><text x="150" y="462" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Pi / AP + ESP32 + LoRa</text><rect x="635" y="255" width="280" height="107" rx="18" fill="white" stroke="#A7BFDF" stroke-width="2"/><use href="#radio" x="651" y="275" width="47" height="47" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="713" y="296" font-size="23" fill="#111820" font-weight="600" text-anchor="start">Ridge relay</text><text x="655" y="337" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Dedicated LoRa forwarding</text><rect x="900" y="500" width="280" height="107" rx="18" fill="white" stroke="#A7BFDF" stroke-width="2"/><use href="#radio" x="916" y="520" width="47" height="47" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="978" y="541" font-size="23" fill="#111820" font-weight="600" text-anchor="start">Hill hub</text><text x="920" y="582" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Pi / AP + ESP32 + LoRa</text><rect x="455" y="650" width="280" height="107" rx="18" fill="white" stroke="#A7BFDF" stroke-width="2"/><use href="#radio" x="471" y="670" width="47" height="47" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="533" y="691" font-size="23" fill="#111820" font-weight="600" text-anchor="start">Health hub</text><text x="475" y="732" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Pi / AP + ESP32 + LoRa</text><use href="#phone" x="115" y="550" width="48" height="48" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="91" y="625" font-size="18" fill="#111820" font-weight="400" text-anchor="start">Resident phone</text><polyline points="157,553 215,488" fill="none" stroke="#64758A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#grayarrow)" marker-start="url(#grayarrow)"/><rect x="95.0" y="510" width="130" height="28" rx="8" fill="white"/><text x="160" y="530" font-size="17" fill="#46515F" font-weight="400" text-anchor="middle">Local Wi-Fi</text><use href="#phone" x="1080" y="663" width="48" height="48" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="1035" y="740" font-size="18" fill="#111820" font-weight="400" text-anchor="start">Resident phone</text><polyline points="1104,662 1063,609" fill="none" stroke="#64758A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#grayarrow)" marker-start="url(#grayarrow)"/><rect x="1068.0" y="626" width="120" height="28" rx="8" fill="white"/><text x="1128" y="646" font-size="17" fill="#46515F" font-weight="400" text-anchor="middle">Local Wi-Fi</text><rect x="130" y="265" width="400" height="68" rx="16" fill="white" stroke="#CCD8C7" stroke-width="2"/><text x="148" y="291" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Phones do not send LoRa directly.</text><text x="148" y="317" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Rich maps / guides stay on phone or hub.</text><rect x="1250" y="247" width="470" height="555" rx="22" fill="white" stroke="#D5DEE8" stroke-width="2"/><text x="1274" y="284" font-size="24" fill="#111820" font-weight="600" text-anchor="start">Range is a field-test question</text><text x="1274" y="316" font-size="19" fill="#006AFF" font-weight="500" text-anchor="start">Illustrative planning rings only</text><circle cx="1483" cy="493" r="135" fill="none" stroke="#006AFF" stroke-width="2" stroke-dasharray="7 7" opacity="0.25"/><circle cx="1483" cy="493" r="81" fill="none" stroke="#006AFF" stroke-width="2" stroke-dasharray="7 7" opacity="0.45"/><circle cx="1483" cy="493" r="27" fill="none" stroke="#006AFF" stroke-width="2" stroke-dasharray="7 7" opacity="0.7"/><use href="#radio" x="1463" y="470" width="40" height="40" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="1450.5" y="438" width="65" height="28" rx="8" fill="white"/><text x="1483" y="458" font-size="17" fill="#46515F" font-weight="400" text-anchor="middle">1 km</text><rect x="1450.5" y="384" width="65" height="28" rx="8" fill="white"/><text x="1483" y="404" font-size="17" fill="#46515F" font-weight="400" text-anchor="middle">3 km</text><rect x="1450.5" y="330" width="65" height="28" rx="8" fill="white"/><text x="1483" y="350" font-size="17" fill="#46515F" font-weight="400" text-anchor="middle">5 km</text><text x="1483" y="656" font-size="18" fill="#111820" font-weight="600" text-anchor="middle">NOT MEASURED COVERAGE</text><text x="1274" y="696" font-size="19" fill="#46515F" font-weight="400" text-anchor="start">Terrain / foliage and antenna height</text><text x="1274" y="725" font-size="19" fill="#46515F" font-weight="400" text-anchor="start">Radio settings, interference and power</text><text x="1274" y="754" font-size="19" fill="#46515F" font-weight="400" text-anchor="start">all change the achievable link.</text><text x="1274" y="777" font-size="17" fill="#46515F" font-weight="400" text-anchor="start">Spacing is a scenario, not a range promise.</text><rect x="55" y="863" width="1690" height="335" rx="27" fill="white" stroke="#9EABBB" stroke-width="2" stroke-dasharray="10 8"/><text x="80" y="904" font-size="22" fill="#111820" font-weight="600" text-anchor="start">SEPARATE OPTION  /  LoRaWAN IoT TELEMETRY</text><text x="80" y="940" font-size="20" fill="#46515F" font-weight="400" text-anchor="start">Standard star-of-stars: end devices → gateway(s) → IP backhaul → network server → application</text><use href="#sensor" x="92" y="1017" width="50" height="50" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><use href="#sensor" x="92" y="1110" width="50" height="50" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="1063" font-size="20" fill="#111820" font-weight="400" text-anchor="start">IoT end devices</text><text x="160" y="1092" font-size="20" fill="#111820" font-weight="400" text-anchor="start">Water / weather sensors</text><rect x="440" y="991" width="257" height="147" rx="20" fill="#F3F7FC" stroke="#D5DEE8" stroke-width="2"/><use href="#radio" x="460" y="1016" width="51" height="51" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="528" y="1037" font-size="23" fill="#111820" font-weight="600" text-anchor="start">Gateway(s)</text><text x="462" y="1080" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Multi-channel RF → IP</text><text x="462" y="1108" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">No gateway mesh shown</text><polyline points="365,1053 440,1036" fill="none" stroke="#006AFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrow)"/><polyline points="365,1110 440,1088" fill="none" stroke="#006AFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#arrow)"/><rect x="332.0" y="974" width="112" height="28" rx="8" fill="white"/><text x="388" y="994" font-size="17" fill="#46515F" font-weight="400" text-anchor="middle">LoRaWAN</text><rect x="1000" y="991" width="282" height="147" rx="20" fill="#F3F7FC" stroke="#D5DEE8" stroke-width="2"/><use href="#server" x="1020" y="1017" width="45" height="45" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="1080" y="1038" font-size="22" fill="#111820" font-weight="600" text-anchor="start">Network server</text><text x="1022" y="1081" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Join / security / deduplication</text><text x="1022" y="1109" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">MAC and downlink control</text><rect x="1435" y="991" width="284" height="147" rx="20" fill="#F3F7FC" stroke="#D5DEE8" stroke-width="2"/><use href="#cloud" x="1454" y="1017" width="47" height="47" fill="none" stroke="#006AFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><text x="1514" y="1038" font-size="23" fill="#111820" font-weight="600" text-anchor="start">Application</text><text x="1458" y="1081" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Telemetry / authorized service</text><text x="1458" y="1109" font-size="18" fill="#46515F" font-weight="400" text-anchor="start">Optional government use</text><polyline points="697,1065 1000,1065" fill="none" stroke="#64758A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#grayarrow)"/><rect x="777.5" y="1022" width="141" height="28" rx="8" fill="white"/><text x="848" y="1042" font-size="17" fill="#46515F" font-weight="400" text-anchor="middle">IP backhaul</text><polyline points="1282,1065 1435,1065" fill="none" stroke="#64758A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 7" marker-end="url(#grayarrow)"/><rect x="1301.5" y="1022" width="113" height="28" rx="8" fill="white"/><text x="1358" y="1042" font-size="17" fill="#46515F" font-weight="400" text-anchor="middle">App data</text><text x="80" y="1174" font-size="19" fill="#111820" font-weight="500" text-anchor="start">This LoRaWAN path is an alternative for sensors, not the mesh connecting Together hubs above.</text><text x="60" y="1245" font-size="20" fill="#111820" font-weight="500" text-anchor="start">All radio hardware is proposed. The current browser MVP simulates links and government bulletins.</text><text x="60" y="1280" font-size="16" fill="#46515F" font-weight="400" text-anchor="start">Sources: lora-alliance.org/about-lorawan · semtech.com/lora/what-is-lora · murata.com/support/faqs/lpwa/lora/hardware/0008</text><text x="60" y="1306" font-size="16" fill="#46515F" font-weight="400" text-anchor="start">Example of a LoRa mesh: meshtastic.org/docs/introduction · Together has not integrated Meshtastic or measured RF performance.</text></g></svg>